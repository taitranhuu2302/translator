name: Windows installer

# The on-demand build: the `.exe` exists on the run for someone to install.
# A tag is not handled here — `release.yml` builds the same file through
# `.github/actions/build-windows-installer` and attaches it to the draft
# release, so a tag would otherwise build it twice.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Build the NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-windows-installer

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(./scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: neris-${{ steps.version.outputs.version }}-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
