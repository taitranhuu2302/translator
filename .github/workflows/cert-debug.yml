name: Cert debug

# Temporary: diagnose why `security import` rejects the release certificate on
# macos-15. Deleted once the release pipeline works.

on: workflow_dispatch

jobs:
  debug:
    runs-on: macos-15
    steps:
      - name: Import and sign a probe
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -uo pipefail
          KC="$RUNNER_TEMP/d.keychain-db"
          printf '%s' "$CERT_B64" > "$RUNNER_TEMP/c.b64"
          base64 -D -i "$RUNNER_TEMP/c.b64" -o "$RUNNER_TEMP/c.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KC"
          security import "$RUNNER_TEMP/c.p12" -k "$KC" -P "$CERT_PW" \
            -T /usr/bin/codesign
          echo "import exit: $?"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KC"
          echo "partition exit: $?"
          security default-keychain -s "$KC"
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')

          echo "--- find-identity -v before trust ---"
          security find-identity -v -p codesigning
          echo "--- find-identity (all) before trust ---"
          security find-identity -p codesigning

          cp /bin/ls "$RUNNER_TEMP/probe"
          codesign --force --timestamp=none --sign "Translator Local Signing" \
            --identifier com.taitran.neris.probe "$RUNNER_TEMP/probe"
          echo "codesign before trust exit: $?"

          security find-certificate -c "Translator Local Signing" -p -k "$KC" \
            | awk '/BEGIN CERTIFICATE/{n++} n==1' > "$RUNNER_TEMP/id.pem"
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/id.pem"
          echo "add-trusted-cert exit: $?"

          echo "--- find-identity -v after trust ---"
          security find-identity -v -p codesigning
          codesign --verify --strict "$RUNNER_TEMP/probe"
          echo "verify exit: $?"
