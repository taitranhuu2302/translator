[package]
name = "translator-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 shell owning the engine and hosting the React UI"

[[bin]]
name = "translator"
path = "src/main.rs"

[features]
# Production only: makes `generate_context!` embed `frontendDist` instead of
# loading `devUrl`. `tauri dev` drops it via `--no-default-features`, and
# `tauri build` adds it, so `scripts/package.sh` has to ask for it explicitly.
custom-protocol = ["tauri/custom-protocol"]
# Release builds only: the app may replace itself with a newer Release
# (docs/adr/0009-self-signed-distribution-and-in-app-updates.md). A local
# `scripts/build.sh` run never enables this — only `package.sh --updater`, which
# the release workflow passes — so a local build reports updates as disabled.
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
translator-core = { workspace = true }
translator-platform-macos = { workspace = true }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = { version = "2", optional = true }
tauri-nspanel = "2.1"
