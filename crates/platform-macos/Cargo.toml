[package]
name = "translator-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The only crate that may touch macOS APIs; implements the core ports"

[build-dependencies]
cc = "1"

[dependencies]
rusqlite = { version = "0.42", features = ["bundled", "functions"] }
serde_json = { workspace = true }
translator-core = { workspace = true }

# `security-framework` empties itself off Apple, but Cargo still builds its
# dependencies, and `core-foundation` does not empty itself: it reaches for
# `std::os::unix` and `libc::PATH_MAX`, so an unconditional dependency fails the
# Windows build before this crate's own `cfg`s are ever read.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[dev-dependencies]
# The history parity test drives the fake store and this crate's real store
# through the same port.
translator-core = { workspace = true, features = ["test-support"] }
