[workspace]
resolver = "2"
members = ["crates/core", "crates/platform-macos", "crates/app"]
# The panel spike is a standalone crate; it is deleted when the real panel lands (ticket 04).
exclude = ["spike/panel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[workspace.dependencies]
translator-core = { path = "crates/core" }
translator-platform-macos = { path = "crates/platform-macos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
